<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>탑승권 업로드</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background:#f8f9fa; padding:20px; }
    .card { border-radius:15px; box-shadow:0 5px 15px rgba(0,0,0,.1); }
    .spinner-border { display:none; }
    .small { font-size:.9rem; color:#6c757d; }
  </style>
</head>
<body>
  <div class="container my-4">
  <div class="card shadow-lg border-0 rounded-4 p-4">
    <!-- 헤더 -->
    <div class="text-center mb-4">
      <div class="bg-primary bg-gradient text-white rounded-circle d-inline-flex align-items-center justify-content-center"
           style="width:60px;height:60px;font-size:1.5rem;box-shadow:0 4px 12px rgba(0,0,0,.15);">
        ✈️
      </div>
      <h3 class="mt-3 fw-bold">🧩탑승권 이미지 제출</h3>
      <p class="text-muted small mb-0">⚠️업로드된 파일은 <b>이름_휴대폰뒤4자리.확장자</b> 형식으로 저장됩니다.</p>
    </div>

    <!-- 폼 -->
    <form id="uploadForm" class="needs-validation" novalidate>
      <!-- 이름 -->
      <div class="mb-3">
        <label class="form-label fw-semibold">📍 이름</label>
        <input type="text" name="name" class="form-control form-control-lg" placeholder="예: 홍길동" required>
        <div class="invalid-feedback">이름을 입력해주세요.</div>
      </div>

      <!-- 연락처 -->
      <div class="mb-3">
        <label class="form-label fw-semibold">📞 연락처</label>
        <input type="tel" name="tel" class="form-control form-control-lg" placeholder="예: 01012345678" required>
        <div class="invalid-feedback">연락처를 입력해주세요.</div>
      </div>

      <!-- 파일 -->
      <div class="mb-3">
        <label class="form-label fw-semibold">🔗 탑승권 이미지 파일</label>
        <input type="file" id="fileInput" class="form-control form-control-lg" required>
        <div class="form-text text-muted">
          권장: <b>5MB 이하 이미지</b><br>
          ⚠️ 이미지파일명 <span class="text-danger">공백 없이</span> 저장해서 올려주세요
        </div>
        <div class="invalid-feedback">탑승권 이미지을 업로드 해주세요.</div>
      </div>

      <!-- 버튼 -->
      <div class="d-grid">
        <button type="submit" id="submitBtn" class="btn btn-primary btn-lg rounded-3">
  <span class="me-2">✅ 제출하기</span>
  <span class="spinner-border spinner-border-sm text-light d-none" id="spinner"></span>
</button>
      </div>
    </form>

    <!-- 결과 메시지 -->
    <div id="result" class="mt-4"></div>
  </div>
</div>

<script>
document.getElementById("uploadForm").addEventListener("submit", async (e) => {
  e.preventDefault();

  const btn = document.getElementById("submitBtn");
  const spinner = document.getElementById("spinner");
  const result = document.getElementById("result");

  btn.disabled = true;
  spinner.classList.remove("d-none");  // 스피너 표시
  result.innerHTML = "";

  try {
    // ✅ 실제 fetch 처리
    const res = await fetch("https://ajoucu.mycafe24.com/proxi.php", {
      method: "POST",
      body: JSON.stringify({ token:"ajou2130==", name:"테스트", tel:"01012345678" }),
      headers: { "Content-Type": "application/json" }
    });

    const text = await res.text();
    result.innerHTML = `<div class="alert alert-success">${text}</div>`;
  } catch (err) {
    result.innerHTML = `<div class="alert alert-danger">❌ 오류: ${err}</div>`;
  } finally {
    // ✅ 완료되면 스피너 숨김
    btn.disabled = false;
    spinner.classList.add("d-none");
  }
});
</script>


<script>

  const scriptURL = "https://ajoucu.mycafe24.com/proxi.php";  // ✅ 프록시 PHP
  const ADMIN_TOKEN = "ajou2130=="; // ✅ PHP와 동일해야 함
  const MAX_MB = 10; // 업로드 용량 제한 (MB)

  document.getElementById("uploadForm").addEventListener("submit", async (e) => {
    e.preventDefault();

    const file = document.getElementById("fileInput").files[0];
    if (!file) {
      alert("파일을 선택해주세요.");
      return;
    }

    // ✅ 용량 제한 검사
    if (file.size > MAX_MB * 1024 * 1024) {
      alert(`⚠️ 파일이 ${MAX_MB}MB를 초과합니다. 더 작은 파일을 업로드해주세요.`);
      return;
    }

    // ✅ 파일명 안전화 (공백·한글·특수문자 → _ 로 변환)
    const safeFilename = file.name
      .replace(/\s+/g, "_")        // 공백 → _
      .replace(/[^\w.-]/g, "_");   // 특수문자 → _

    const name = document.querySelector("[name=name]").value.trim();
    const telRaw = document.querySelector("[name=tel]").value;
    const tel = (telRaw || "").replace(/\D/g, ""); // 숫자만

    const btn = document.getElementById("submitBtn");
    const spinner = document.getElementById("spinner");
    const result = document.getElementById("result");

    btn.disabled = true;
    spinner.style.display = "inline-block";
    result.innerHTML = "";

    const reader = new FileReader();
    reader.onload = async function(event) {
      try {
        const base64Data = event.target.result.split(",")[1]; // data:... 제거

        // ✅ 업로드 payload
        const payload = {
          token: ADMIN_TOKEN,
          name,
          tel,
          filename: safeFilename,  // 안전화된 파일명 사용
          filedata: base64Data
        };

        // ✅ PHP 프록시 호출
        const res = await fetch(scriptURL, {
          method: "POST",
          headers: { 
            "Content-Type": "application/json",
            "Accept": "application/json"
          },
          body: JSON.stringify(payload)
        });

        // ✅ 응답 처리
        let msg = "";
        const text = await res.text(); // 원본 응답 먼저 가져오기
        try {
          const json = JSON.parse(text);
          if (!res.ok || json.ok === false) {
            msg = json.error || `서버 오류 (HTTP ${res.status})`;
            result.innerHTML = `<div class="alert alert-danger">❌ ${msg}</div>`;
          } else {
            msg = json.message || "업로드 성공";
            const link = json.fileUrl ? `<br><a href="${json.fileUrl}" target="_blank">🔎 제출파일 보기</a>` : "";
            result.innerHTML = `<div class="alert alert-success">✅ ${msg}${link}</div>`;
            e.target.reset();
          }
        } catch {
          // JSON 파싱 실패 시 텍스트 그대로 출력
          if (!res.ok) {
            result.innerHTML = `<div class="alert alert-danger">❌ 서버 오류 (HTTP ${res.status})<br>${text}</div>`;
          } else {
            result.innerHTML = `<div class="alert alert-success">${text}</div>`;
            e.target.reset();
          }
        }
      } catch (err) {
        result.innerHTML = `<div class="alert alert-danger">❌ 네트워크 오류: ${err.message || err}</div>`;
      } finally {
        btn.disabled = false;
        spinner.style.display = "none";
      }
    };
    reader.readAsDataURL(file);
  });
</script>
</body>
</html>
