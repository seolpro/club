<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>탑승권 업로드</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background:#f8f9fa; padding:20px; }
    .card { border-radius:15px; box-shadow:0 5px 15px rgba(0,0,0,.1); }
    .spinner-border { display:none; }
    .small { font-size:.9rem; color:#6c757d; }
  </style>
</head>
<body>
  <div class="container">
    <div class="card p-4">
      <h3 class="mb-1">✈️ 탑승권 파일 제출</h3>
      <p class="small mb-3">파일명은 <b>이름_휴대폰뒤4자리.확장자</b>로 저장됩니다.</p>

      <form id="uploadForm">
        <div class="mb-3">
          <label class="form-label">이름</label>
          <input type="text" name="name" class="form-control" required>
        </div>
        <div class="mb-3">
          <label class="form-label">연락처</label>
          <input type="tel" name="tel" class="form-control" required placeholder="01012345678">
        </div>
        <div class="mb-3">
          <label class="form-label">탑승권 파일</label>
          <!-- 형식 제한 없음 -->
          <input type="file" id="fileInput" class="form-control" required>
          <div class="form-text">최대 5MB 권장 (대용량은 업로드가 느릴 수 있어요)</div>
        </div>
        <button type="submit" id="submitBtn" class="btn btn-primary">
          제출하기
          <div class="spinner-border spinner-border-sm text-light ms-2" id="spinner"></div>
        </button>
      </form>
      <div id="result" class="mt-3"></div>
    </div>
  </div>

<script>
  const scriptURL = "https://ajoucu.mycafe24.com/proxi.php";  // ✅ 철자 주의! proxi.php
  const ADMIN_TOKEN = "ajou2130=="; // ✅ PHP와 동일해야 함
  const MAX_MB = 5; // 권장 업로드 한도(선택)

  document.getElementById("uploadForm").addEventListener("submit", async (e) => {
    e.preventDefault();

    const file = document.getElementById("fileInput").files[0];
    if (!file) {
      alert("파일을 선택해주세요.");
      return;
    }
    if (file.size > MAX_MB * 1024 * 1024) {
      alert(`파일이 ${MAX_MB}MB를 초과합니다. 더 작은 파일을 올려주세요.`);
      return;
    }

    const name = document.querySelector("[name=name]").value.trim();
    const telRaw = document.querySelector("[name=tel]").value;
    const tel = (telRaw || "").replace(/\D/g, ""); // 숫자만

    const btn = document.getElementById("submitBtn");
    const spinner = document.getElementById("spinner");
    const result = document.getElementById("result");

    btn.disabled = true;
    spinner.style.display = "inline-block";
    result.innerHTML = "";

    const reader = new FileReader();
    reader.onload = async function(event) {
      try {
        const base64Data = event.target.result.split(",")[1]; // data:... 제거
        const payload = {
          token: ADMIN_TOKEN,
          name, tel,
          filename: file.name,
          filedata: base64Data
        };

        const res = await fetch(scriptURL, {
          method: "POST",
          headers: { "Content-Type": "application/json", "Accept":"application/json" },
          body: JSON.stringify(payload)
        });

        let msg = "";
        try {
          const json = await res.json();
          if (!res.ok || json.ok === false) {
            msg = json.error || `서버 오류 (HTTP ${res.status})`;
            result.innerHTML = `<div class="alert alert-danger">❌ ${msg}</div>`;
          } else {
            msg = json.message || "업로드 성공";
            const link = json.fileUrl ? `<br><a href="${json.fileUrl}" target="_blank">🧩제출파일 보기</a>` : "";
            result.innerHTML = `<div class="alert alert-success">✅ ${msg}${link}</div>`;
            e.target.reset();
          }
        } catch {
          // JSON이 아닐 경우 텍스트로 표시
          const text = await res.text();
          if (!res.ok) {
            result.innerHTML = `<div class="alert alert-danger">❌ 서버 오류 (HTTP ${res.status})<br>${text}</div>`;
          } else {
            result.innerHTML = `<div class="alert alert-success">${text}</div>`;
            e.target.reset();
          }
        }
      } catch (err) {
        result.innerHTML = `<div class="alert alert-danger">❌ 네트워크 오류: ${err}</div>`;
      } finally {
        btn.disabled = false;
        spinner.style.display = "none";
      }
    };
    reader.readAsDataURL(file);
  });
</script>
</body>
</html>
