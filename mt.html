<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>산악회 참가 신청</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    .banner {
      position: relative;
      height: 300px;
      overflow: hidden;
    }
    .banner img {
      position: absolute;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0;
      transition: opacity 1s ease-in-out;
    }
    .banner img.active {
      opacity: 1;
      z-index: 1;
    }
  </style>
</head>
<body class="bg-light">
  <div class="banner" id="banner">
    <img src="https://cdn.cctoday.co.kr/news/photo/202206/2164062_596894_2628.jpg" alt="banner1">
    <img src="https://san.chosun.com/news/photo/200707/2820_3736_5620.jpg" alt="banner2">
    <img src="https://t1.daumcdn.net/cfile/blog/226AB14458E83A4904" alt="banner3">
    <img src="https://koreahike.com/wp-content/uploads/%EC%A1%B0%EB%A0%B9%EC%82%B0-%EC%A0%95%EC%83%81%EC%97%90%EC%84%9C%EC%9D%98-%ED%92%8D%EA%B2%BD.jpg" alt="banner4">
    <img src="https://i.ytimg.com/vi/MgczqZ5TBQ8/hqdefault.jpg" alt="banner5">
  </div>

  <div class="container mt-5">
    <h2 class="text-center mb-4">산악회 참가 신청서</h2>
    <form id="signupForm">
      <div class="mb-3">
        <label for="name" class="form-label">성명</label>
        <input type="text" id="name" name="name" class="form-control" required>
      </div>
      <div class="mb-3">
        <label for="contact" class="form-label">연락처</label>
        <input type="text" id="contact" name="contact" class="form-control" required>
      </div>
      <div class="mb-3">
        <label for="participants" class="form-label">참가인원</label>
        <select id="participants" name="participants" class="form-select">
          <option value="1">1명</option>
          <option value="2">2명</option>
          <option value="3">3명</option>
          <option value="4">4명</option>
          <option value="5">5명</option>
        </select>
      </div>
      <div class="mb-3">
        <label for="nonMembers" class="form-label">비회원 인원</label>
        <select id="nonMembers" name="nonMembers" class="form-select">
          <option value="0">0명</option>
          <option value="1">1명</option>
          <option value="2">2명</option>
          <option value="3">3명</option>
          <option value="4">4명</option>
          <option value="5">5명</option>
        </select>
      </div>
      <div class="mb-3">
        <label for="memberNames" class="form-label">동반회원명</label>
        <input type="text" id="memberNames" name="memberNames" class="form-control">
      </div>
      <div class="mb-3">
        <label for="course" class="form-label">신청코스</label>
        <select id="course" name="course" class="form-select">
          <option value="코스 A">코스 A</option>
          <option value="코스 B">코스 B</option>
        </select>
      </div>
      <div class="mb-3">
        <label for="remarks" class="form-label">기타 남기실 말씀</label>
        <textarea id="remarks" name="remarks" class="form-control"></textarea>
      </div>
      <div class="text-end">
        <button type="submit" class="btn btn-primary">제출하기</button>
      </div>
    </form>

    <hr>
    <h4 class="mt-5">신청 내역</h4>
    <div id="entryList" class="mt-3"></div>
  </div>

  <script>
    // 배너 랜덤 이미지 fade
    const images = document.querySelectorAll('#banner img');
    let current = 0;
    function showRandomImage() {
      images[current].classList.remove('active');
      let next;
      do {
        next = Math.floor(Math.random() * images.length);
      } while (next === current);
      images[next].classList.add('active');
      current = next;
    }
    images[0].classList.add('active');
    setInterval(showRandomImage, 4000);

    // 신청서 제출
    document.getElementById('signupForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      const form = new FormData(this);
      const data = Object.fromEntries(form);
      const confirmed = confirm("제출하시겠습니까?");
      if (!confirmed) return;
      const res = await fetch('https://script.google.com/macros/s/AKfycbyhIglOxd3UZjxt73RtExWzigw0wkdnTZ4lT4HDEb56__sqv6yAdjeST_71LY751xcg/exec', {
        method: 'POST',
        mode: "no-cors",
        body: JSON.stringify(data),
        headers: { 'Content-Type': 'application/json' }
      });
      if (res.ok) {
        alert("신청이 완료되었습니다.");
        this.reset();
        loadEntries();
      }
    });

    async function loadEntries() {
      const res = await fetch('https://script.google.com/macros/s/AKfycbyhIglOxd3UZjxt73RtExWzigw0wkdnTZ4lT4HDEb56__sqv6yAdjeST_71LY751xcg/exec');
      const entries = await res.json();
      const container = document.getElementById('entryList');
      container.innerHTML = '';
      entries.forEach(entry => {
        const div = document.createElement('div');
        div.className = 'border p-3 mb-2 rounded bg-white';
        div.innerHTML = `
          <strong>${entry.name}</strong> - ${entry.participants}명
          <button class="btn btn-sm btn-danger float-end" onclick="cancelEntry('${entry.name}', '${entry.contact}')">취소하기</button>
        `;
        container.appendChild(div);
      });
    }

    async function cancelEntry(name, contact) {
      if (!confirm("정말 취소하시겠습니까?")) return;
      const res = await fetch(`https://script.google.com/macros/s/AKfycbyhIglOxd3UZjxt73RtExWzigw0wkdnTZ4lT4HDEb56__sqv6yAdjeST_71LY751xcg/exec?name=${encodeURIComponent(name)}&contact=${encodeURIComponent(contact)}`);
      if (res.ok) {
        alert("취소되었습니다.");
        loadEntries();
      }
    }

    window.onload = loadEntries;
  </script>
</body>
</html>
