<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>산악회 신청 안내</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      max-width: 900px;
      margin: 5px auto;
      padding: 10px;
      background-color: #f8f9fa;
    }
    iframe {
      border-radius: 10px;
      border: none;
      width: 100%;
      min-height: 400px;
    }
  </style>
</head>
<body>
  <h3 class="text-center mb-4">🏕 산악회 4월 등반 일정 및 참가 신청</h3>
  <div class="mb-4">
    <div id="carouselBanner" class="carousel slide" data-bs-ride="carousel">
      <div class="carousel-inner">
        <div class="carousel-item active">
          <img src="https://cdn.visitkorea.or.kr/img/call?cmd=VIEW&id=a04d8d60-dcc2-4384-8097-82068be0813a" class="d-block w-100" alt="배너1">
        </div>
        <div class="carousel-item">
          <img src="https://cdn.sansan.co.kr/news/photo/202309/21421_24313_3927.jpeg" class="d-block w-100" alt="배너2">
        </div>
        <div class="carousel-item">
          <img src="https://www.yeongnam.com/mnt/file/202410/2024100401000147000004791.jpg" class="d-block w-100" alt="배너3">
        </div>
      </div>
    </div>
  </div>

  <p>
    ⛰️ <strong>산행일시:</strong> 2025년 4월 12일(토) 오전 7시 ~ 오후 6시<br>
    📍 <strong>장소:</strong> 조령산 및 문경새재 트래킹<br>
    🛤️ <strong>코스:</strong><br>
    - A코스: 조령산 정상 등반 (중간 난이도)<br>
    - B코스: 연풍 ~ 문경새재 트래킹 (쉬움)<br>
    💳 <strong>참가비:</strong> 회원 2만원 / 비회원 4만원 (하산식 포함)<br>
    📅 <strong>신청 마감:</strong> 4월 6일(일)까지 (당일 코스 변경 가능)
  </p>

  <hr>
  <h4 class="mb-3">📝 참가 신청하기</h4>
  <iframe id="mountainFrame" src="https://script.google.com/macros/s/AKfycbzSuUzz5f7Eszg2I0fYuFvZY9NlFwXZmR0gF7w1L5l8uD5k0ZoUak9Qlne70wOlmeEw/exec" scrolling="no"></iframe>

  <script>
    window.addEventListener("message", (event) => {
      if (event.origin.includes("script.google.com")) {
        const iframe = document.getElementById("mountainFrame");
        if (event.data.height) {
          iframe.style.height = event.data.height + "px";
        }
      }
    });
  </script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
