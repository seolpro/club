<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>🚢 승선자 등록 폼</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background-color: #f8f9fa; }
    .form-section { background: white; padding: 2rem; border-radius: 1rem; box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
    .form-label { font-weight: 600; }
    .passenger-group:not(:first-child) { margin-top: 1rem; }
  </style>
</head>
<body>
<div class="container py-5">
  <h3 class="mb-4 text-center">📝 승선자 등록</h3>
  <form id="boardingForm" class="form-section">
    <div class="mb-3">
      <label class="form-label">📍성명</label>
      <input type="text" class="form-control" placeholder="회원 또는 동행인 성명" id="leaderName" required oninput="syncLeaderToFirstPassenger()">
    </div>
    <div class="mb-3">
      <label class="form-label">📞연락처</label>
      <input type="tel" class="form-control" id="leaderContact" placeholder="숫자만" required>
    </div>

    <h5 class="mt-4">👥 승선자(회원 포함) 명단</h5>
    <div id="passengerList"></div>

    <button type="button" class="btn btn-outline-secondary mb-3" onclick="addPassenger()">➕ 추가</button>

    <div class="mb-3">
      <label class="form-label">📝기타 코멘트(선택)</label>
      <textarea class="form-control" id="comment" rows="1"></textarea>
    </div>

    <div class="mb-3">
      <button class="btn btn-outline-warning w-100" type="button" data-bs-toggle="collapse" data-bs-target="#consentDetails" aria-expanded="false" aria-controls="consentDetails">
        📌 개인정보 수집 및 활용 동의 내용 보기/닫기🔃
      </button>
      <div class="collapse mt-2" id="consentDetails">
        <div class="card card-body bg-light">
          본 신청서에서는 승선자 명단 제출를 위해 다음의 개인정보를 수집.활용 및 제3자에 제공합니다.
          <ul class="mt-2 mb-1">
            <li>성명</li>
            <li>연락처</li>
            <li>생년월일</li>
            <li>성별</li>
            <li>상기 개인정보 제3자(유한회사 대부해운) 제공</li>
          </ul>
          수집된 정보는 해당 목적 외에는 활용(제공)되지 않으며, 활용 후 즉시 파기됩니다.
        </div>
      </div>
    </div>

    <div class="form-check mb-4">
      <input class="form-check-input" type="checkbox" id="consentCheck" required>
      <label class="form-check-label" for="consentCheck">
        (필수)트래킹참여 승선명단제출관련 개인정보 수집 및 활용에 동의합니다.
      </label>
    </div>

    <button type="submit" class="btn btn-primary w-100" id="submitBtn">📤 제출 하기</button>
  </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
const form = document.getElementById("boardingForm");
const submitBtn = document.getElementById("submitBtn");
const passengerList = document.getElementById("passengerList");
let passengerCount = 0;

function resetPassengersToDefault() {
  passengerList.innerHTML = '';
  passengerCount = 0;
  addPassenger();
  syncLeaderToFirstPassenger();
}

function addPassenger(name = "", birth = "", gender = "") {
  const group = document.createElement("div");
  group.className = "passenger-group d-flex flex-wrap gap-2 mb-2";
  group.innerHTML = `
    <input type="text" class="form-control passenger-name flex-fill" placeholder="성명" value="${name}" style="min-width: 120px;">
    <input type="text" class="form-control birth flex-fill" placeholder="생년월일 6자리" pattern="\\d{6}" inputmode="numeric" value="${birth}" style="min-width: 120px;">
    <select class="form-select gender flex-fill" style="min-width: 100px;">
      <option value="">성별</option>
      <option value="남" ${gender === "남" ? "selected" : ""}>남</option>
      <option value="여" ${gender === "여" ? "selected" : ""}>여</option>
    </select>
    ${passengerCount > 0 ? `<button type="button" class="btn btn-outline-danger" onclick="this.closest('.passenger-group').remove()">⛔</button>` : ``}
  `;
  passengerList.appendChild(group);
  passengerCount++;
}

function syncLeaderToFirstPassenger() {
  const leaderName = document.getElementById("leaderName").value.trim();
  const firstPassengerNameInput = passengerList.querySelector(".passenger-group:first-child .passenger-name");
  if (firstPassengerNameInput) {
    firstPassengerNameInput.value = leaderName;
  }
}

form.addEventListener("submit", async (e) => {
  e.preventDefault();

  if (!form.checkValidity()) {
    form.reportValidity();
    return;
  }

  const data = {
    leaderName: document.getElementById("leaderName").value.trim(),
    leaderContact: document.getElementById("leaderContact").value.trim(),
    passengers: [],
    comment: document.getElementById("comment").value.trim()
  };

  const birthRegex = /^\d{6}$/;
  let validPassengerCount = 0;
  let passengerSummary = "";

  document.querySelectorAll(".passenger-group").forEach(group => {
    const nameEl = group.querySelector(".passenger-name");
    const birthEl = group.querySelector(".birth");
    const genderEl = group.querySelector(".gender");

    const name = nameEl.value.trim();
    const birth = birthEl.value.trim();
    const gender = genderEl.value;

    if (name && birthRegex.test(birth) && (gender === "남" || gender === "여")) {
      data.passengers.push({ name, birth, gender });
      passengerSummary += `- ${name} (${birth}, ${gender})\n`;
      validPassengerCount++;
      nameEl.classList.remove('is-invalid');
      birthEl.classList.remove('is-invalid');
      genderEl.classList.remove('is-invalid');
    } else {
      if (!name) nameEl.classList.add('is-invalid');
      if (!birthRegex.test(birth)) birthEl.classList.add('is-invalid');
      if (!gender) genderEl.classList.add('is-invalid');
    }
  });

  if (validPassengerCount < 1) {
    alert("❗ 승선자 정보를 1명 이상 정확히 입력해 주세요.");
    return;
  }

  const consentCheck = document.getElementById("consentCheck");
  if (!consentCheck.checked) {
    alert("⚠ 개인정보 수집 및 활용 동의에 체크해 주세요.");
    return;
  }

  const confirmText = `🧾 입력된 승선자 명단을 확인해 주세요:\n\n${passengerSummary}\n제출하시겠습니까?`;
  if (!confirm(confirmText)) return;

  submitBtn.disabled = true;
  submitBtn.innerHTML = "⏳ 제출중...";

  try {
    await fetch("https://script.google.com/macros/s/AKfycbzzAHbqXbKvUtIVaQ6VH3Mo9hOGBSfib5DzqDuJRCFdsHk7BjgOEZ_M550EAHskasBA/exec", {
      method: "POST",
      mode: "no-cors",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(data)
    });

    alert("✅ 제출이 완료되었습니다!");
    form.reset();
    resetPassengersToDefault();
  } catch (err) {
    alert("⚠ 오류 발생: 다시 시도해주세요.");
    console.error(err);
  } finally {
    submitBtn.disabled = false;
    submitBtn.innerHTML = "📤 제출하기";
  }
});

document.addEventListener("DOMContentLoaded", () => {
  resetPassengersToDefault();
});
</script>
</body>
</html>
