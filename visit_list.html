<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>제주 단체여행객 지원금 신청</title>

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />

  <style>
    :root{ --brand:#0d6efd; --soft:#f6f8fb; }
    body{ background:var(--soft); font-family: system-ui, -apple-system, "Noto Sans KR", Roboto, sans-serif; }
    .page{ max-width: 880px; margin: auto; padding: clamp(16px, 3vw, 32px); }
    .card{ border:0; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,.08); }
    .hero{
      background: radial-gradient(1200px 300px at 10% -10%, rgba(13,110,253,.15), transparent),
                  radial-gradient(1000px 400px at 110% -20%, rgba(25,135,84,.15), transparent);
      border-radius: 20px; padding: 28px; color:#0b3c5d;
    }
    .required::after{ content:" *"; color:#dc3545; font-weight: 700; }
    .safe{ font-size:.9rem; color:#6c757d; }
    .btn-xl{ padding:.9rem 1.25rem; border-radius: 14px; font-weight: 700; }
  </style>
</head>
<body>
  <main class="page">
    <div class="hero mb-4">
      <h1 class="h3 mb-2">제주 단체여행객 지원금 신청</h1>
      <p class="mb-0">참가자 정보를 입력해 주세요. 입력하신 정보는 지원금 확인 및 안내 목적에만 사용됩니다.</p>
    </div>

    <div class="card">
      <div class="card-body p-4 p-md-5">
        <form id="applyForm" novalidate>
          <div class="row g-3">
            <div class="col-12 col-md-6">
              <label class="form-label required">성명</label>
              <input type="text" class="form-control" id="name" name="name" placeholder="홍길동" required />
              <div class="invalid-feedback">성명을 입력해 주세요.</div>
            </div>

            <div class="col-12 col-md-6">
              <label class="form-label required">연락처</label>
              <input type="tel" class="form-control" id="tel" name="tel" inputmode="numeric" placeholder="01012345678" required />
              <div class="form-text">숫자만 입력 (예: 01012345678)</div>
              <div class="invalid-feedback">연락처(숫자만)를 올바르게 입력해 주세요.</div>
            </div>

            <!-- 주소검색: 다음(카카오) 우편번호 API -->
            <div class="col-12 col-md-4">
              <label class="form-label required">우편번호</label>
              <div class="input-group">
                <input type="text" class="form-control" id="zipcode" name="zipcode" placeholder="우측에서 검색하여 입력" readonly required />
                <button type="button" class="btn btn-outline-secondary" id="btnPost">🔎주소검색</button>
              </div>
              <div class="invalid-feedback">주소검색 버튼으로 우편번호를 선택해 주세요.</div>
            </div>

            <div class="col-12 col-md-8">
              <label class="form-label required">주소</label>
              <input type="text" class="form-control" id="addr1" name="addr1" placeholder="기본주소" readonly required />
              <div class="invalid-feedback">기본주소를 선택해 주세요.</div>
            </div>

            <div class="col-12">
              <label class="form-label">상세주소</label>
              <input type="text" class="form-control" id="addr2" name="addr2" placeholder="상세주소(동/호수 등)" />
            </div>

            <div class="col-12">
              <label class="form-label">기타 남기실 말씀(선택)</label>
              <textarea class="form-control" id="memo" name="memo" rows="2" placeholder="전달 사항이 있다면 적어주세요."></textarea>
            </div>

            <div class="col-12">
              <div class="form-check">
                <input class="form-check-input" type="checkbox" value="Y" id="agree" required>
                <label class="form-check-label" for="agree">
                  개인정보 수집·이용에 동의합니다. (제주 여행객 지원금 신청관련)
                </label>
                <div class="invalid-feedback">동의가 필요합니다.</div>
              </div>
              <p class="safe mt-2"><i class="bi bi-shield-check me-1"></i>입력 정보는 지원금 확인 목적으로만 사용되며, 목적 달성 후 안전하게 파기됩니다.</p>
            </div>
          </div>

          <div class="d-grid d-md-flex gap-2 mt-4">
            <button id="btnSubmit" class="btn btn-primary btn-xl">
              <span class="label"><i class="bi bi-send me-1"></i>신청 제출</span>
              <span class="spinner-border spinner-border-sm ms-2 d-none" role="status" aria-hidden="true"></span>
            </button>
            <button type="reset" class="btn btn-outline-secondary btn-xl"><i class="bi bi-arrow-counterclockwise me-1"></i>초기화</button>
          </div>
        </form>
      </div>
    </div>

    <!-- Toast -->
    <div class="position-fixed bottom-0 end-0 p-3" style="z-index: 1080;">
      <div id="toast" class="toast align-items-center text-bg-success border-0" role="alert" aria-live="assertive" aria-atomic="true">
        <div class="d-flex">
          <div class="toast-body">정상적으로 제출되었습니다. 감사합니다!</div>
          <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <!-- 다음 우편번호 API -->
  <script src="https://t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script>
  <script>
    // ▶▶ GAS 웹앱 URL (배포 후 나온 URL로 교체)
    const WEBAPP_URL = "https://script.google.com/macros/s/AKfycbwGCOzIDEL35vxrHm87dU_wnsxXu4hID0rTPQmmNPi2d6DlGztpcGdH8jtvP2Jx2CVAfw/exec"; // 예: https://script.google.com/macros/s/AKfycbx.../exec

    const $ = (sel) => document.querySelector(sel);

    // 연락처 숫자만 유지
    $('#tel').addEventListener('input', (e) => {
      e.target.value = e.target.value.replace(/\D+/g, '').slice(0, 11);
    });

    // 다음 주소검색
    $('#btnPost').addEventListener('click', () => {
      new daum.Postcode({
        oncomplete: function(data){
          const addr = data.roadAddress || data.jibunAddress || '';
          $('#zipcode').value = data.zonecode || '';
          $('#addr1').value = addr;
          $('#addr2').focus();
        }
      }).open();
    });

    // 폼 검증
    function validateForm(){
      const form = $('#applyForm');
      form.classList.add('was-validated');
      const telOk = /^\d{10,11}$/.test($('#tel').value.trim());
      if(!telOk){ $('#tel').setCustomValidity('Invalid'); } else { $('#tel').setCustomValidity(''); }
      return form.checkValidity();
    }

    // 제출
    $('#applyForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      if(!validateForm()) return;

      const btn = $('#btnSubmit');
      const spin = btn.querySelector('.spinner-border');
      btn.disabled = true; spin.classList.remove('d-none');

      const payload = {
        name : $('#name').value.trim(),
        tel  : $('#tel').value.trim(),
        zipcode: $('#zipcode').value.trim(),
        addr1: $('#addr1').value.trim(),
        addr2: $('#addr2').value.trim(),
        memo : $('#memo').value.trim(),
        agree: $('#agree').checked ? 'Y' : 'N'
      };

      try{
        // 외부 HTML → GAS: CORS 회피를 위해 no-cors (응답 본문은 읽지 못함)
        await fetch(WEBAPP_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        // 성공 토스트
        const toast = new bootstrap.Toast($('#toast'));
        toast.show();
        // 폼 리셋
        $('#applyForm').reset();
        $('#applyForm').classList.remove('was-validated');

      } catch(err){
        alert('제출 중 오류가 발생했습니다. 잠시 후 다시 시도해 주세요.');
        console.error(err);
      } finally {
        btn.disabled = false; spin.classList.add('d-none');
      }
    });
  </script>
</body>
</html>
