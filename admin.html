<!-- ✅ admin.html - 관리자 페이지 (검색 & 취소 기능 포함) -->
<!-- ======================== -->
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>산악회 관리자</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body class="bg-light">
  <div class="container py-5">
    <h3 class="text-center mb-4">신청자 관리</h3>
    <input type="text" id="search" class="form-control mb-3" placeholder="이름 또는 연락처 검색">
    <div id="adminList"></div>
  </div>
  <script>
    async function loadAdminEntries() {
      const res = await fetch('https://script.google.com/macros/s/AKfycbztYPRh9LLqJiVerFhc0i6T9hrlb01X6sT14JojL3OUzCcnOo7et_DHmtF44avmIA9B/exec');
      const entries = await res.json();
      const container = document.getElementById('adminList');
      container.innerHTML = '';
      const keyword = document.getElementById('search').value.trim();
      entries
        .filter(entry => !keyword || entry.name.includes(keyword) || entry.contact.includes(keyword))
        .forEach(entry => {
          const div = document.createElement('div');
          div.className = 'border p-3 mb-2 rounded bg-white shadow-sm';
          div.innerHTML = `
            <strong>${entry.name}</strong> - ${entry.participants}명 - ${entry.contact}
            <button class="btn btn-sm btn-danger float-end" onclick="cancelEntry('${entry.name}', '${entry.contact}')">삭제</button>
          `;
          container.appendChild(div);
        });
    }

    async function cancelEntry(name, contact) {
      if (!confirm("정말 삭제하시겠습니까?")) return;
      const res = await fetch(`https://script.google.com/macros/s/AKfycbztYPRh9LLqJiVerFhc0i6T9hrlb01X6sT14JojL3OUzCcnOo7et_DHmtF44avmIA9B/exec?name=${encodeURIComponent(name)}&contact=${encodeURIComponent(contact)}`);
      if (res.ok) {
        alert("삭제되었습니다.");
        loadAdminEntries();
      }
    }

    document.getElementById('search').addEventListener('input', loadAdminEntries);
    window.onload = loadAdminEntries;
  </script>
</body>
</html>
