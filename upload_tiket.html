<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>🚀탑승권 업로드하기</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <style>
    body{background:#f8f9fa}
    .toast-container{position:fixed;bottom:1rem;right:1rem;z-index:1080}
    canvas.signature-pad { touch-action: none; }
    .codebox{
      background:#0f172a; color:#e2e8f0; border-radius:10px; padding:14px 16px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      font-size:.85rem; line-height:1.4; overflow:auto;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.06);
    }
    .accordion-button:not(.collapsed){ background:#f8fafc; }
    .signature-pad { touch-action: none; }
    .sig-wrap      { touch-action: none; }
    body.noscroll { overflow: hidden; position: fixed; width: 100%; }
    html.noscroll { overscroll-behavior: none; }
    .arrow-icon { display: inline-block; transition: transform 0.3s ease; }
    button[aria-expanded="true"] .arrow-icon {
      transform: rotate(180deg); /* ▶ → ▼ 회전 */
    }
  </style>
</head>
<body>
<div class="container py-4">
  <h5 id="formTitle" class="mb-3">💦잠시 후 탑승권 업로드 form이 생성됩니다..</h5>

  <!-- 행사내용/개인정보 제공 동의 안내문 영역 -->
  <div id="formInfo" class="mb-3 p-3 border rounded bg-light">
    <span>탑승권을 아래에 업로드 해 주세요</span>
    <p class="small text-muted">
      # 업로드 파일: 탑승권 캡쳐 이미지 <br>
    </p>

    <!-- 개인정보 제공 및 활용 동의 (펼치기/접기) -->
    <div class="mb-3">
      <button class="btn btn-link d-flex align-items-center text-decoration-none p-0" 
              type="button" data-bs-toggle="collapse" data-bs-target="#privacyCollapse" 
              aria-expanded="false" aria-controls="privacyCollapse">
        <span class="me-2">🔒 개인정보 제공 및 활용 동의 보기/닫기</span>
        <span class="arrow-icon">▶</span>
      </button>
      <div class="collapse mt-2" id="privacyCollapse">
        <div class="card card-body small text-muted">
          입력하신 성명, 연락처, 파일 등의 개인정보는 목적 외에는 사용되지 않으며,<br>
          관련 법령에 따라 안전하게 관리됩니다.
        </div>
      </div>
    </div>
  </div>

  <div id="formArea" class="card shadow-sm p-3">
    🔄탑승권 업로드폼을 로딩 중입니다...잠시만 기다려 주세요
  </div>
</div>

<div class="toast-container">
  <div id="toast" class="toast" role="alert" aria-live="assertive" aria-atomic="true">
    <div class="toast-body">상태 메시지</div>
  </div>
</div>

<script>
  // 현재 연도 자동 (footer 제거했으므로 필요없지만 남겨도 무해)
  (function(){ const y=document.getElementById('copyYear'); if(y) y.textContent=new Date().getFullYear(); })();
</script>

<script>
// ===== 설정 GAS서버 Url 및 formkey =====
 const GAS_ENDPOINT = 'https://script.google.com/macros/s/AKfycbwh6CTslFHxqEPCppYRJA0Em3LPGrAyNXRLYh_WLC_sBF-2cff494648HiyskpxlWU8/exec'; // 🔁 Web App 배포URL
const FORM_KEY = 'join2025';

let SCHEMA = [];
let META = {}; // { title, submitText, loadingText, confirmText? }

// ===== Kakao 주소 API =====
let _kakaoSDKLoading = null;
function loadKakaoPostcodeSDK() {
  if (window.daum && window.daum.Postcode) return Promise.resolve();
  if (_kakaoSDKLoading) return _kakaoSDKLoading;
  _kakaoSDKLoading = new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = 'https://t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js';
    s.onload = () => resolve();
    s.onerror = () => reject(new Error('Kakao Postcode SDK 로드 실패'));
    document.head.appendChild(s);
  });
  return _kakaoSDKLoading;
}
function openPostcode(name) {
  loadKakaoPostcodeSDK().then(() => {
    new daum.Postcode({
      oncomplete: (data) => {
        const v = `[${data.zonecode}] ${data.roadAddress || data.jibunAddress || ''}`.trim();
        const input = document.getElementById(`f_${name}`);
        if (input) input.value = v;
      }
    }).open();
  }).catch(err => setStatus(err.message, 'danger'));
}

// ===== 서명 캔버스 =====
// 개선판: 서명 패드 상태 저장
const signaturePads = {}; // name -> {canvas, ctx, drawing, dirty, ratio, ro}

/**
 * 서명 패드 초기화
 * - 고해상도(scale) 대응
 * - 리사이즈 시 기존 선 보존
 * - 포인터 캡처(드래그 중 벗어나도 선 끊김 방지)
 * - 모바일 스크롤/줌 방지 (touch-action: none)
 */
function setupSignature(name) {
  const wrap = document.getElementById(`sigwrap_${name}`);
  const canvas = document.getElementById(`sig_${name}`);
  if (!canvas || !wrap) return;

  // 스타일적으로 스크롤/줌 방지
  canvas.classList.add('signature-pad');
  canvas.style.touchAction = 'none';

  // 상태 준비
  signaturePads[name] = {
    canvas,
    ctx: null,
    drawing: false,
    dirty: false,
    ratio: Math.max(window.devicePixelRatio || 1, 1),
    ro: null
  };

  const pad = () => signaturePads[name];

  // 리사이즈 (그림 보존)
  let resizeRAF = null;
  function resizeCanvas(preserve = false) {
    const p = pad();
    if (!p) return;

    // 1) 이전 그림 백업
    let prevURL = null;
    if (preserve && canvas.width && canvas.height) {
      try { prevURL = canvas.toDataURL('image/png'); } catch (e) {}
    }

    // 2) 고해상도 대응
    const ratio = Math.max(window.devicePixelRatio || 1, 1);
    const rect = wrap.getBoundingClientRect();
    const cssHeight = 360;  // 또는 360
    canvas.style.height = cssHeight + 'px';

    canvas.width = Math.floor(rect.width * ratio);
    canvas.height = Math.floor(cssHeight * ratio);
    canvas.style.width = '100%';
    canvas.style.height = cssHeight + 'px';

    // 3) 컨텍스트(스케일/펜설정)
    const ctx = canvas.getContext('2d');
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.scale(ratio, ratio); // 이후 좌표는 CSS px 기준
    ctx.lineWidth = 3;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.strokeStyle = '#000';

    // 상태 반영 (여기를 마지막에 단 한 번만 갱신)
    p.ctx = ctx;
    p.ratio = ratio;

    // 4) 이전 그림 복원
    if (prevURL) {
      const img = new Image();
      img.onload = () => {
        ctx.drawImage(img, 0, 0, canvas.width / ratio, canvas.height / ratio);
      };
      img.src = prevURL;
    }
  }

  // 최초 1회
  resizeCanvas(false);

  // 래퍼의 실제 크기 변화 관찰 + 디바운스
  const ro = new ResizeObserver(() => {
    cancelAnimationFrame(resizeRAF);
    resizeRAF = requestAnimationFrame(() => resizeCanvas(true));
  });
  ro.observe(wrap);

  // 관찰자 저장
  pad().ro = ro;

  // 좌표 계산 (CSS px 기준)
  function getPos(evt) {
    const r = canvas.getBoundingClientRect();
    return { x: evt.clientX - r.left, y: evt.clientY - r.top };
  }

   // 🔒 스크롤 잠금/해제 유틸
  const lockScroll = () => {
    document.body.classList.add('noscroll');
    document.documentElement.classList.add('noscroll');
    // iOS Safari에서 캔버스 밖 드래그 시도 대비
    window.addEventListener('touchmove', preventTouchScroll, { passive: false });
  };
  const unlockScroll = () => {
    document.body.classList.remove('noscroll');
    document.documentElement.classList.remove('noscroll');
    window.removeEventListener('touchmove', preventTouchScroll, { passive: false });
  };
  const preventTouchScroll = (e) => {
    // 드로잉 중에는 전역 스크롤 차단
    if (signaturePads[name]?.drawing) e.preventDefault();
  };

  // ... getPos, 등 등 기존 함수들 그대로 ...

  function start(e) {
    e.preventDefault();
    const p = pad();
    p.drawing = true;

    // ✅ 드로잉 시작 시 스크롤 잠금
    lockScroll();

    if (e.pointerId != null && canvas.setPointerCapture) {
      try { canvas.setPointerCapture(e.pointerId); } catch (_) {}
    }
    const { x, y } = getPos(e);
    p.ctx.beginPath();
    p.ctx.moveTo(x, y);
  }

  function end(e) {
    const p = pad();
    if (!p || !p.drawing) return;
    e.preventDefault();
    p.drawing = false;

    // ✅ 드로잉 종료 시 스크롤 해제
    unlockScroll();

    if (e.pointerId != null && canvas.releasePointerCapture) {
      try { canvas.releasePointerCapture(e.pointerId); } catch (_) {}
    }
  }
 
  // 이벤트 핸들러
  function start(e) {
    e.preventDefault();
    const p = pad();
    p.drawing = true;
    // 포인터 캡처: 드래그 중 캔버스 밖으로 나가도 추적
    if (e.pointerId != null && canvas.setPointerCapture) {
      try { canvas.setPointerCapture(e.pointerId); } catch (_) {}
    }
    const { x, y } = getPos(e);
    p.ctx.beginPath();
    p.ctx.moveTo(x, y);
  }

  function move(e) {
    const p = pad();
    if (!p.drawing) return;
    e.preventDefault();
    const { x, y } = getPos(e);
    p.ctx.lineTo(x, y);
    p.ctx.stroke();
    p.dirty = true;
  }

  function end(e) {
    const p = pad();
    if (!p || !p.drawing) return;
    e.preventDefault();
    p.drawing = false;
    if (e.pointerId != null && canvas.releasePointerCapture) {
      try { canvas.releasePointerCapture(e.pointerId); } catch (_) {}
    }
  }

  // 포인터 이벤트(패시브 false로 preventDefault 허용)
  canvas.addEventListener('pointerdown', start, { passive: false });
  canvas.addEventListener('pointermove', move, { passive: false });
  canvas.addEventListener('pointerup', end, { passive: false });
  canvas.addEventListener('pointerleave', end, { passive: false });
  canvas.addEventListener('pointercancel', end, { passive: false });

  // 지우기 버튼
  const clearBtn = document.getElementById(`sigclear_${name}`);
  if (clearBtn) clearBtn.onclick = () => {
    const p = pad();
    p.ctx.clearRect(0, 0, p.canvas.width, p.canvas.height);
    p.dirty = false;
    const hidden = document.getElementById(`f_${name}`);
    if (hidden) hidden.value = '';
  };
}

/**
 * 저장: 히든 입력값에 PNG dataURL 기록
 * - 흰 배경 포함(투명 배경 검게 보이는 문제 예방)
 */
function saveSignatureToInput(name) {
  const p = signaturePads[name];
  const hidden = document.getElementById(`f_${name}`);
  if (!p || !hidden) return;
  hidden.value = p.dirty ? getSignatureDataURL(p) : '';
  // (옵션) 미리보기 텍스트 박스가 있다면 동기화
  const preview = document.getElementById(`f_${name}_preview`);
  if (preview) preview.value = hidden.value;
}

/* 내부 유틸: 현재 패드를 흰 배경 포함 PNG로 변환 */
function getSignatureDataURL(p) {
  // 원하는 내보내기 종횡비(예: 정사각형)
  const outW = Math.max(p.canvas.width, p.canvas.height);
  const outH = outW; // 정사각형
  const t = document.createElement('canvas');
  t.width = outW; t.height = outH;
  const ctx = t.getContext('2d');

  // 흰 배경
  ctx.fillStyle = '#fff';
  ctx.fillRect(0,0,outW,outH);

  // 원본을 비율 유지해 중앙 배치
  const scale = Math.min(outW / p.canvas.width, outH / p.canvas.height);
  const dw = p.canvas.width * scale;
  const dh = p.canvas.height * scale;
  const dx = (outW - dw) / 2;
  const dy = (outH - dh) / 2;
  ctx.drawImage(p.canvas, dx, dy, dw, dh);

  return t.toDataURL('image/png');
}


// ===== 공통 유틸 =====
function onReady(fn){ if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', fn); else fn(); }
function setStatus(msg, type='muted'){ const el = document.getElementById('statusMsg'); if (!el) return; el.className = `ms-2 small text-${type}`; el.textContent = msg || ''; }
function ensureFormTitle(){
  const el = document.getElementById('formTitle');
  if (el) el.textContent = META.title || '신청 폼';
}

function ensureButtons() {
  const area = document.getElementById('formArea');
  if (!area) return;
  if (!area.querySelector('#submitBtn')) {
    const wrap = document.createElement('div');
    wrap.className = 'mt-3 d-flex gap-2 align-items-center';
    wrap.innerHTML = `
      <button id="submitBtn" class="btn btn-primary">${META.submitText || '✅신청(제출)하기'}</button>
      <button id="resetBtn" class="btn btn-outline-secondary" type="button">초기화</button>
      <span id="statusMsg" class="ms-2 small text-muted"></span>
    `;
    area.appendChild(wrap);
  } else {
    const sb = area.querySelector('#submitBtn');
    if (sb) sb.textContent = META.submitText || '✅신청(제출)하기';
  }

  document.getElementById('submitBtn').onclick = submitForm;
  document.getElementById('resetBtn').onclick = () => {
    // 기본 입력 초기화
    area.querySelectorAll('input, textarea, select').forEach(el => {
      const t = (el.getAttribute('type') || '').toLowerCase();
      if (t === 'checkbox' || t === 'radio') {
        el.checked = false;
      } else {
        el.value = '';
      }
    });
    // 서명도 초기화
    Object.keys(signaturePads).forEach(k => {
      const p = signaturePads[k];
      if (p) { p.ctx.clearRect(0,0,p.canvas.width,p.canvas.height); p.dirty=false; }
      const hidden = document.getElementById(`f_${k}`);
      if (hidden) hidden.value = '';
    });
    setStatus('');
  };
}

// ===== 렌더링 =====
function renderForm(schema, status='ok') {
  const area = document.getElementById('formArea');
  if (!area) return;

  if (status !== 'ok') { area.innerHTML = `<div class="text-danger">스키마 로드 실패: ${status}</div>`; return; }
  if (!Array.isArray(schema)) { area.innerHTML = `<div class="text-danger">스키마 형식 오류</div>`; return; }
  if (schema.length === 0) {
    area.innerHTML = `
      <div class="text-warning">
        스키마에 <code>${FORM_KEY}</code> 관련 필드가 없습니다.
        <ul class="mt-2 mb-0 small">
          <li>schema 시트에 formKey가 정확한지</li>
          <li>헤더가 formKey/order/label/type/name/options/required 인지</li>
          <li>웹앱을 최신으로 다시 배포했는지</li>
        </ul>
      </div>`;
    return;
  }

  const html = schema.map(f => {
    const id = `f_${f.name}`;
    const req = f.required ? 'required' : '';
    const requiredAsterisk = f.required ? ' *' : '';
    const options = (f.options || '').split(',').map(s => s.trim()).filter(Boolean);

    // 1) 멀티라인
    if (f.type === 'textarea') {
      return `
        <div class="mb-3">
          <label class="form-label">${f.label}${requiredAsterisk}</label>
          <textarea id="${id}" class="form-control" ${req}></textarea>
        </div>`;
    }

    // 2) 셀렉트
    if (f.type === 'select') {
      const opts = options.map(v => `<option value="${v}">${v}</option>`).join('');
      return `
        <div class="mb-3">
          <label class="form-label">${f.label}${requiredAsterisk}</label>
          <select id="${id}" class="form-select" ${req}>${opts}</select>
        </div>`;
    }

    // 3) 주소(카카오 우편번호)
    if (f.type === 'address') {
      return `
        <div class="mb-3">
          <label class="form-label">${f.label}${requiredAsterisk}</label>
          <div class="input-group">
            <input id="${id}" type="text" class="form-control" ${req} placeholder="우편번호/도로명 주소" readonly>
            <button class="btn btn-outline-secondary" type="button" onclick="openPostcode('${f.name}')">주소검색</button>
          </div>
        </div>`;
    }

    // 4) 서명
    if (f.type === 'signature') {
      return `
        <div class="mb-3">
          <label class="form-label">${f.label}${requiredAsterisk}</label>
          <div id="sigwrap_${f.name}" class="border rounded-3 bg-white" style="width:100%; height:180px;">
            <canvas id="sig_${f.name}" style="width:100%; height:180px; display:block;"></canvas>
          </div>
          <div class="mt-2 d-flex gap-2">
            <button id="sigclear_${f.name}" class="btn btn-sm btn-outline-secondary" type="button">지우기</button>
          </div>
          <input id="${id}" type="hidden" ${req} />
        </div>`;
    }

    // 5) 날짜/시간 계열
    if (f.type === 'date' || f.type === 'time' || f.type === 'datetime' || f.type === 'month') {
      const inputType = (f.type === 'datetime') ? 'datetime-local' : f.type; // datetime → datetime-local
      return `
        <div class="mb-3">
          <label class="form-label">${f.label}${requiredAsterisk}</label>
          <input id="${id}" type="${inputType}" class="form-control" ${req}>
        </div>`;
    }

    // 6) 라디오 (단일 선택)
    if (f.type === 'radio') {
      const nameAttr = `f_${f.name}`;
      const radios = options.map((v, i) => {
        const rid = `${id}_${i}`;
        return `
          <div class="form-check">
            <input class="form-check-input" type="radio" name="${nameAttr}" id="${rid}" value="${v}" ${req}>
            <label class="form-check-label" for="${rid}">${v}</label>
          </div>`;
      }).join('');
      return `
        <div class="mb-3">
          <label class="form-label d-block">${f.label}${requiredAsterisk}</label>
          ${radios}
        </div>`;
    }

    // 7) 체크박스(복수 선택): type = checkboxes
    if (f.type === 'checkboxes') {
      const nameAttr = `f_${f.name}[]`;
      const checks = options.map((v, i) => {
        const cid = `${id}_${i}`;
        return `
          <div class="form-check">
            <input class="form-check-input" type="checkbox" name="${nameAttr}" id="${cid}" value="${v}">
            <label class="form-check-label" for="${cid}">${v}</label>
          </div>`;
      }).join('');
      // required의 경우, 최소 1개 선택을 프런트에서 강제하지 않고, 제출 시 검증 로직에서 처리(아래 validateRequired 사용)
      return `
        <div class="mb-3">
          <label class="form-label d-block">${f.label}${requiredAsterisk}</label>
          ${checks}
        </div>`;
    }

    // 8) 체크박스(단일): type = checkbox  (체크 시 "Y", 미체크 시 "")
    if (f.type === 'checkbox') {
      const cid = `${id}_single`;
      return `
        <div class="mb-3 form-check">
          <input class="form-check-input" type="checkbox" id="${cid}">
          <label class="form-check-label" for="${cid}">${f.label}${requiredAsterisk}</label>
          <input id="${id}" type="hidden" />
        </div>`;
    }

    // 10) 파일 업로드 (이미지 등)
if (f.type === 'file') {
  const accept = (f.options || '').includes('images') ? 'accept="image/*"' : '';
  return `
    <div class="mb-3">
      <label class="form-label">${f.label}${requiredAsterisk}</label>
      <input id="${id}" type="file" class="form-control" ${accept} ${req}>
    </div>`;
}

    // 9) 일반 인풋 (fallback)
    const t = ['text','tel','email','number','url','password'].includes(f.type) ? f.type : 'text';
    return `
      <div class="mb-3">
        <label class="form-label">${f.label}${requiredAsterisk}</label>
        <input id="${id}" type="${t}" class="form-control" ${req}>
      </div>`;
  }).join('');

  area.innerHTML = html;

  // 서명 패드 초기화
  SCHEMA.filter(f => f.type === 'signature').forEach(f => setupSignature(f.name));

  ensureButtons();
}

// ===== 제출 =====
function collect(){
  const data = {};
  SCHEMA.forEach(f => {
    const baseId = `f_${f.name}`;
    // signature는 hidden에 담김(아래 submitForm에서 직렬화)
    if (f.type === 'radio') {
      const sel = document.querySelector(`input[name="${baseId}"]:checked`);
      data[f.name] = sel ? sel.value : '';
      return;
    }
    if (f.type === 'checkboxes') {
      const nodes = document.querySelectorAll(`input[name="${baseId}[]"]:checked`);
      const vals = Array.from(nodes).map(n => n.value);
      data[f.name] = vals.join(', ');
      return;
    }
    if (f.type === 'checkbox') {
      // 단일 체크박스: 체크시 "Y", 아니면 ""
      const single = document.getElementById(`${baseId}_single`);
      data[f.name] = single && single.checked ? 'Y' : '';
      // 숨겨진 input에도 동일값 반영(필요시)
      const hidden = document.getElementById(baseId);
      if (hidden) hidden.value = data[f.name];
      return;
    }
//file 입력시
    if (f.type === 'file') {
  const el = document.getElementById(baseId);
  if (el && el.files && el.files[0]) {
    const file = el.files[0];
    data[f.name] = {
      name: file.name,
      type: file.type,
      size: file.size
      // 실제 전송은 submitForm에서 FileReader로 Base64 인코딩
    };
  } else {
    data[f.name] = '';
  }
  return;
}

    const el = document.getElementById(baseId);
    data[f.name] = el ? String(el.value || '').trim() : '';
  });
  return data;
}
function validateRequired(payload){
  const missing = [];
  SCHEMA.forEach(f => {
    if (!f.required) return;
    const val = String(payload[f.name] || '').trim();
    if (f.type === 'checkboxes') {
      // 최소 1개 선택 필요
      if (!val) missing.push(f.label);
    } else if (f.type === 'checkbox') {
      // 단일 체크박스: 체크(= "Y")가 되어야 함
      if (val !== 'Y') missing.push(f.label);
    } else {
      if (!val) missing.push(f.label);
    }
  });
  return missing;
}
async function parseJsonSafe(res){
  const text = await res.text();
  try { return JSON.parse(text); }
  catch { return { ok:false, error:`Non-JSON response: ${text.slice(0,200)}` }; }
}
async function postWithFallback(body){
  try{
    const res = await fetch(GAS_ENDPOINT, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body) });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    return await parseJsonSafe(res);
  }catch(err){
    console.warn('[POST json] 실패, urlencoded 폴백:', err);
    const res2 = await fetch(GAS_ENDPOINT, { method:'POST', headers:{'Content-Type':'application/x-www-form-urlencoded'}, body: 'payload=' + encodeURIComponent(JSON.stringify(body)) });
    if (!res2.ok) throw new Error(`HTTP ${res2.status}`);
    return await parseJsonSafe(res2);
  }
}

function formatBytes(n){
  if (!n && n !== 0) return '';
  const u = ['B','KB','MB','GB','TB'];
  let i = 0, v = Number(n);
  while (v >= 1024 && i < u.length-1) { v /= 1024; i++; }
  return `${v.toFixed(v >= 100 ? 0 : v >= 10 ? 1 : 2)} ${u[i]}`;
}

function fmtValueForDisplay(f, v){
  // 서명은 기존처럼
  if (f.type === 'signature') return v ? '(📝서명 이미지 있음)' : '(⛔미서명)';

  // 파일인 경우
  if (f.type === 'file') {
    if (!v) return '(파일 없음)';
    if (typeof v === 'string') return v; // URL이나 파일명 문자열일 수도 있음
    const name = v.name || '(이름 없음)';
    const size = v.size ? ` • ${formatBytes(v.size)}` : '';
    return name + size;
  }

  // 그 외
  return String(v ?? '');
}

function buildConfirmText(payload){
  const lines = SCHEMA.map(f => {
    const raw = payload[f.name];
    const val = fmtValueForDisplay(f, raw);
    return `${f.label}: ${val}`;
  });
  return (META.confirmText || '🤷‍♂️아래와 같이 제출하시겠습니까?\n\n') + lines.join('\n');
}

async function fileToBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result.split(',')[1]); // "data:...;base64," 잘라냄
    reader.onerror = err => reject(err);
    reader.readAsDataURL(file);
  });
}

async function submitForm(){
  const submitBtn = document.getElementById('submitBtn');
  const normalLabel = META.submitText || '✔신청(제출)하기';
  try {
    if (submitBtn) {
      submitBtn.disabled = true;
      submitBtn.textContent = '🔄제출(신청)중...잠시만 기다려주세요';
    }
    setStatus('🔄전송(제출) 중…');

    // 📝 서명 저장
    SCHEMA.filter(f => f.type === 'signature').forEach(f => saveSignatureToInput(f.name));

    const payload = collect();

    // ✅ 파일(Base64) 변환
    for (const f of SCHEMA) {
      if (f.type === 'file') {
        const el = document.getElementById(`f_${f.name}`);
        if (el && el.files && el.files[0]) {
          payload[f.name].base64 = await fileToBase64(el.files[0]);
        }
      }
    }

    // ✅ 필수값 검증
    const missing = validateRequired(payload);
    if (missing.length) {
      alert('⚠ 다음 누락된 항목을 입력(체크)해 주세요:\n\n - ' + missing.join('\n- '));
      setStatus(`⚠️필수 입력 누락: ${missing.join(', ')}`, 'danger');
      return;
    }

    // ✅ 사용자 확인
    const ok = window.confirm(buildConfirmText(payload));
    if (!ok) {
      setStatus('⛔제출이 취소되었습니다', 'warning');
      return;
    }

    const idk = (self.crypto && crypto.randomUUID) ? crypto.randomUUID() : String(Date.now());
    const body = { formKey: FORM_KEY, payload, idempotencyKey: idk };

    const j = await postWithFallback(body);
    if (!j.ok) throw new Error(j.error || '저장 실패');

    setStatus('✅제출(신청)이 완료되었습니다!', 'success');
  } catch (err) {
    setStatus(`오류: ${err.message}`, 'danger');
  } finally {
    if (submitBtn) {
      submitBtn.disabled = false;
      submitBtn.textContent = normalLabel;
    }
  }
}

// ===== 스키마 로드 & 초기화 =====
async function fetchSchema(){
  const url = `${GAS_ENDPOINT}?action=schema&formKey=${encodeURIComponent(FORM_KEY)}`;
  const res = await fetch(url);
  const j = await res.json();
  if (!j.ok) throw new Error(j.error || 'unknown');
  META = j.meta || {};
  return j.schema || [];
}
function onInit(){
  const area = document.getElementById('formArea');
  if (area && !area.dataset.initialized) { area.innerHTML = '🔄탑승권 업로드폼을 로딩 중입니다...잠시만 기다려 주세요'; area.dataset.initialized = '1'; }
  fetchSchema()
    .then(s => { SCHEMA = s; ensureFormTitle(); if (META.loadingText && area) area.innerHTML = META.loadingText; renderForm(s, 'ok'); })
    .catch(e => { console.error('스키마 로드 실패:', e); renderForm([], e.message); });
}
document.readyState === 'loading' ? document.addEventListener('DOMContentLoaded', onInit) : onInit();
</script>
