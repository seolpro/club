<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>산악회 가입 신청서</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <div class="container mt-5">
    <h4>📝 산악회 동아리 가입 신청서</h4>
    <form id="clubForm">
      <div class="form-group">
        <label>사번</label>
        <input type="number" class="form-control" name="employeeId" required>
      </div>
      <div class="form-group">
        <label>성명</label>
        <input type="text" class="form-control" name="name" required>
      </div>
      <div class="form-group">
        <label>부서명</label>
        <input type="text" class="form-control" name="job" required>
      </div>
      <div class="form-group">
        <label>연락처 (숫자만)</label>
        <input type="tel" class="form-control" name="contact" required>
      </div>
      <div class="form-group">
        <label>등산 경험</label>
        <select class="form-control" name="motivation">
          <option value="">✔ 선택하세요</option>
          <option value="없어요">없어요 (👶 등린이)</option>
          <option value="2년미만">2년 미만</option>
          <option value="2년이상">2년 이상</option>
          <option value="3년이상고수">3년 이상 고수</option>
          <option value="전문산악인">전문 산악인</option>
        </select>
      </div>
      <div class="form-group">
        <label>기타 말씀</label>
        <textarea class="form-control" name="comment"></textarea>
      </div>
      <button type="submit" class="btn btn-primary">📝 제출하기</button>
      <div id="loading" style="display:none;" class="mt-2">📤 제출 중입니다...</div>
    </form>
  </div>

  <script>
    document.getElementById("clubForm").addEventListener("submit", async function (e) {
      e.preventDefault();
      const form = e.target;
      const data = new FormData(form);
      const params = new URLSearchParams(data);

      if (!form.employeeId.value || !form.name.value || !form.contact.value) {
        alert("필수 정보를 입력해주세요.");
        return;
      }

      const confirmMsg = `입력 확인:\n\n사번: ${form.employeeId.value}\n성명: ${form.name.value}\n부서명: ${form.job.value}\n연락처: ${form.contact.value}\n등산경험: ${form.motivation.value}\n\n제출하시겠습니까?`;
      if (!confirm(confirmMsg)) return;

      document.getElementById("loading").style.display = "block";

      try {
        const response = await fetch("https://script.google.com/macros/s/AKfycby_Tx0iqMKFjCbbdciqQtzgFU73O1P36zt7jn1GYjPy2LfdaA9vCiVQkJk5B9YimxOtaQ/exec", {
          method: "POST",
          body: params,
          mode: "no-cors",
        });
        alert("신청이 완료되었습니다!");
        form.reset();
      } catch (error) {
        alert("오류가 발생했습니다. 다시 시도해주세요.");
      } finally {
        document.getElementById("loading").style.display = "none";
      }
    });
  </script>
</body>
</html>
