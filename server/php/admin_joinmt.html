    <!-- ▽ 전자장부 탭 -->

      <div class="section-card mb-3" id="ledgerInputCard">

        <!-- 단건 입력 -->

            <div class="col-6 col-md-3">

                <option value="교통비(버스대여료)">교통비(버스대여료)</option>
                <option value="식대(간식)">식대(간식)</option>
                <option value="경조금">경조금</option>
                <option value="기타내역(참고)">기타내역(참고)</option>
              </select>
            </div>
            <div class="col-6 col-md-2">
  <input
    type="text"
    class="form-control form-control-sm"
    id="note"
    name="note"
    placeholder="비고"
    autocomplete="off"
  >
</div>
         </div>

          <div class="row g-2 mt-2">
            <div class="col-6 col-md-3">

            </div>
            <div class="col-6 col-md-3">
              <input type="file" class="form-control form-control-sm"
                     id="proof2_file" name="proof2_file"

              <img id="proof2_preview"

      <!-- 이전 전자장부 링크 박스 -->

        <h6 class="mb-2">📑 이전 전자장부</h6>
        <p class="text-muted small mb-3">
          기존 Google 스프레드시트 증빙이 포함된 전자장부 내역을 확인하려면 아래 버튼을 클릭하세요.
        </p>
        <a href="https://docs.google.com/spreadsheets/d/1-jy0s3TyZeuSi7Ib1BaG2gOg9NmkwI198KVwmVwnVE8/edit?usp=sharing"

            <thead class="table-light">

                <th>거래일</th>
                <th class="text-end">입금</th>
                <th class="text-end">출금</th>
                <th>적요</th>
                <th class="text-end">잔액</th>
                <th>증빙</th>
                <th>비고</th>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
const API_URL = 'club_api.php';
const ADMIN_PW = '1004'; // 필요시 여기만 변경

// ✅ URL 파라미터로 관리자 여부 결정 (?admin=1 이면 관리자)
const urlParams = new URLSearchParams(location.search);
const IS_ADMIN = urlParams.get('admin') === '1';

// 숫자 포맷
function fmt(el){
  let v = el.value.replace(/,/g,'');
  if (!v) { el.value = ''; return; }
  if (!isNaN(v)) el.value = parseInt(v,10).toLocaleString();
}

/* =====================
   개인정보 마스킹 함수
===================== */

// 전화번호 포맷: 010-1234-5678
function formatPhone(contact) {
  if (!contact) return '';
  const onlyNum = contact.replace(/\D/g, '');
  if (!/^\d{10,11}$/.test(onlyNum)) return contact;
  return onlyNum.replace(/(\d{3})(\d{3,4})(\d{4})/, '$1-$2-$3');
}

// 전화번호 마스킹: 010-****-5678
function maskPhone(contact) {
  if (!contact) return '';
  const onlyNum = contact.replace(/\D/g, '');
  if (!/^\d{10,11}$/.test(onlyNum)) return contact;
  return onlyNum.replace(/(\d{3})\d{4}(\d{4})/, '$1-****-$2');
}

// 화면용 연락처
function getDisplayPhone(contact) {
  return IS_ADMIN ? formatPhone(contact) : maskPhone(contact);
}

// 사번 마스킹: 앞 2자리만 보이고 나머지는 *
function maskEmployeeId(empId) {
  if (!empId) return '';
  const s = String(empId);
  if (s.length <= 2) return '**';
  return s.slice(0,2) + '*'.repeat(s.length - 2);
}

// 화면용 사번
function getDisplayEmpId(empId) {
  return IS_ADMIN ? (empId || '') : maskEmployeeId(empId);
}

/* =====================
   회원 관리
===================== */
let MEMBER_CACHE = [];

async function loadMembers(status='') {
  try {
    const url = API_URL + '?action=list_members' + (status ? '&status='+encodeURIComponent(status) : '');
    const res = await fetch(url);
    const json = await res.json();
    if (!json.ok) { alert('회원 조회 오류: '+json.msg); return; }

    MEMBER_CACHE = json.members || [];
    renderMemberTable(MEMBER_CACHE);
  } catch (e) {
    console.error(e);
    alert('회원 조회 중 오류가 발생했습니다.');
  }
}

function renderMemberTable(list) {
  const tb = document.getElementById('memberTbody');
  tb.innerHTML = '';
  list.forEach((m, idx)=>{
    const tr = document.createElement('tr');
    let statusBadge = m.status === 'active'
      ? '<span class="badge text-bg-success">활동</span>'
      : '<span class="badge text-bg-secondary">탈퇴</span>';

    const displayEmpId = getDisplayEmpId(m.employee_id);
    const displayContact = getDisplayPhone(m.contact);

    // ✅ 2024-03-01이면 화면에서는 "2024년 이전 가입"으로 표시
    const displayJoinedDate =
      (m.joined_date === '2024-03-01')
        ? '2024년 이전 가입'
        : (m.joined_date || '');

    // ✅ 관리자 모드에서만 탈퇴/복귀 버튼 표시
    const manageBtnHtml = IS_ADMIN
      ? (m.status === 'active'
          ? `<button class="btn btn-sm btn-outline-danger" onclick="withdrawMember(${m.id}, '${m.name}')">탈퇴</button>`
          : `<button class="btn btn-sm btn-outline-success" onclick="activateMember(${m.id}, '${m.name}')">복귀</button>`
        )
      : '';

    tr.innerHTML = `
      <td>${idx+1}</td>
      <td>${displayEmpId}</td>
      <td>${m.name}</td>
      <td>${m.department}</td>
      <td>${displayContact}</td>
      <td>${m.motivation || ''}</td>
      <td>${statusBadge}</td>
      <td>${displayJoinedDate}</td>
      <td>${m.withdrawn_date || ''}</td>
      <td>${manageBtnHtml}</td>
    `;
    tb.appendChild(tr);
  });
}


function filterMemberTable() {
  const kw = document.getElementById('memberSearch').value.toLowerCase();
  const filtered = MEMBER_CACHE.filter(m =>
    (m.name || '').toLowerCase().includes(kw) ||
    (m.department || '').toLowerCase().includes(kw)
  );
  renderMemberTable(filtered);
}

async function withdrawMember(id, name){
  if (!IS_ADMIN) {
    alert('관리자 전용 기능입니다.');
    return;
  }
  const reason = prompt(`⚠️ ${name} 회원을 탈퇴 처리합니다.\n사유를 입력해 주세요(선택):`);
  if (reason === null) return;
  try {
    const res = await fetch(API_URL, {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({action:'update_member_status', id, status:'withdrawn', reason})
    });
    const json = await res.json();
    if (!json.ok) { alert('탈퇴 처리 실패: '+json.msg); return; }
    alert('✅ 탈퇴 처리되었습니다.');
    loadMembers();
  } catch (e) {
    console.error(e);
    alert('탈퇴 처리 중 오류가 발생했습니다.');
  }
}

async function activateMember(id, name){
  if (!IS_ADMIN) {
    alert('관리자 전용 기능입니다.');
    return;
  }
  if (!confirm(`${name} 회원을 활동 상태로 복귀시키겠습니까?`)) return;
  try {
    const res = await fetch(API_URL, {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({action:'update_member_status', id, status:'active'})
    });
    const json = await res.json();
    if (!json.ok) { alert('복귀 실패: '+json.msg); return; }
    alert('✅ 활동 상태로 변경되었습니다.');
    loadMembers();
  } catch (e) {
    console.error(e);
    alert('복귀 처리 중 오류가 발생했습니다.');
  }
}

// (참고) 회원 CSV 업로드는 현재 HTML에서 막혀 있으니 그대로 두되, 관리자 체크만 추가
async function uploadMemberCsv(event){
  event.preventDefault();

  if (!IS_ADMIN) {
    alert('관리자 전용 기능입니다.');
    return;
  }

  const pw = document.getElementById('member_csv_pw').value.trim();
  if (!pw) {
    alert('비밀번호를 입력해 주세요.');
    return;
  }
  if (typeof ADMIN_PW !== 'undefined' && pw !== ADMIN_PW) {
    alert('비밀번호가 올바르지 않습니다.');
    return;
  }

  const fileInput = document.getElementById('members_csv');
  if (!fileInput.files.length) {
    alert('CSV 파일을 선택해 주세요.');
    return;
  }

  const fd = new FormData();
  fd.append('action','upload_members_csv');
  fd.append('members_csv', fileInput.files[0]);

  try {
    const res = await fetch(API_URL, {
      method:'POST',
      body: fd
    });
    const json = await res.json();
    if (!json.ok) {
      alert('업로드 실패: ' + (json.msg || '서버 오류'));
      return;
    }
    alert('✅ 회원 CSV 업로드 완료\n' + (json.msg || ''));
    document.getElementById('member_csv_pw').value = '';
    document.getElementById('members_csv').value = '';
    loadMembers(); // 리스트 새로고침
  } catch (e) {
    console.error(e);
    alert('회원 CSV 업로드 중 오류가 발생했습니다.');
  }
}

/* =====================
   전자장부
===================== */

// 증빙 썸네일
function renderProofThumb(url) {
  if (!url) return '';
  const lower = url.toLowerCase();
  const isImg = /\.(jpg|jpeg|png|gif|webp)$/i.test(lower);

  if (isImg) {
    return `<a href="${url}" target="_blank">
              <img src="${url}"
                   style="max-width:70px;max-height:70px;border-radius:6px;border:1px solid #ddd;">
            </a>`;
  } else {
    return `<a href="${url}" target="_blank">📎 파일</a>`;
  }
}

async function loadLedger(){
  try {
    const res = await fetch(API_URL + '?action=list_ledger');
    const json = await res.json();
    if (!json.ok) { alert('전자장부 조회 오류: '+json.msg); return; }

    const tb = document.getElementById('ledgerTbody');
    tb.innerHTML = '';
    (json.ledger || []).forEach(row=>{
      const tr = document.createElement('tr');
      const dep = row.deposit ? parseInt(row.deposit,10).toLocaleString() : '';
      const wit = row.withdrawal ? parseInt(row.withdrawal,10).toLocaleString() : '';
      const bal = row.balance ? parseInt(row.balance,10).toLocaleString() : '';
      const proofs = [row.proof1_url, row.proof2_url]
        .filter(Boolean)
        .map(renderProofThumb)
        .join(' ');

      // ✅ 관리자 모드에서만 삭제 버튼 표시
      const manageBtnHtml = IS_ADMIN
        ? `<button class="btn btn-sm btn-outline-danger" onclick="deleteLedger(${row.id})">삭제</button>`
        : '';

      tr.innerHTML = `
        <td>${row.trade_date}</td>
        <td class="text-end text-primary">${dep}</td>
        <td class="text-end text-danger">${wit}</td>
        <td>${row.description}</td>
        <td class="text-end fw-bold">${bal}</td>
        <td>${proofs}</td>
        <td>${row.note || ''}</td>
        <td>${manageBtnHtml}</td>
      `;
      tb.appendChild(tr);
    });
  } catch (e) {
    console.error(e);
    alert('전자장부 조회 중 오류가 발생했습니다.');
  }
}

// 파일 미리보기 (이미지인 경우만)
function setupProofPreview(inputId, imgId) {
  const input = document.getElementById(inputId);
  const img = document.getElementById(imgId);
  if (!input || !img) return;

  input.addEventListener('change', () => {
    const file = input.files[0];
    if (!file) {
      img.style.display = 'none';
      img.src = '';
      return;
    }
    if (file.type.startsWith('image/')) {
      const reader = new FileReader();
      reader.onload = e => {
        img.src = e.target.result;
        img.style.display = 'block';
      };
      reader.readAsDataURL(file);
    } else {
      // 이미지가 아니면 썸네일 숨기고 끝
      img.style.display = 'none';
      img.src = '';
    }
  });
}

async function submitLedger(event){
  event.preventDefault();

  if (!IS_ADMIN) {
    alert('관리자 전용 기능입니다.');
    return;
  }

  const pw = document.getElementById('ledger_pw').value.trim();
  if (!pw) {
    alert('비밀번호를 입력해 주세요.');
    return;
  }
  if (pw !== ADMIN_PW) {
    alert('비밀번호가 올바르지 않습니다.');
    return;
  }

  const trade_date = document.getElementById('trade_date').value;
  const depVal = document.getElementById('deposit').value.replace(/,/g,'');
  const witVal = document.getElementById('withdrawal').value.replace(/,/g,'');
  const description = document.getElementById('description').value;
  const note = document.getElementById('note').value;

  if (!trade_date) {
    alert('거래일을 입력해 주세요.');
    return;
  }
  if (!depVal && !witVal) {
    alert('입금 또는 출금 중 하나는 입력해 주세요.');
    return;
  }

  const formEl = document.getElementById('ledgerForm');
  const fd = new FormData(formEl);
  fd.append('action','insert_ledger');
  fd.set('trade_date', trade_date);
  fd.set('deposit', depVal || '0');
  fd.set('withdrawal', witVal || '0');
  fd.set('description', description);
  fd.set('note', note);

  try {
    const res = await fetch(API_URL, {
      method:'POST',
      body: fd
    });
    const json = await res.json();
    if (!json.ok) {
      alert('저장 실패: ' + (json.msg || '서버 오류'));
      return;
    }
    alert('✅ 전자장부가 저장되었습니다.');

    // 폼 리셋
    document.getElementById('deposit').value = '';
    document.getElementById('withdrawal').value = '';
    document.getElementById('note').value = '';
    document.getElementById('proof1_file').value = '';
    document.getElementById('proof2_file').value = '';
    document.getElementById('ledger_pw').value = '';
    document.getElementById('proof1_preview').style.display = 'none';
    document.getElementById('proof2_preview').style.display = 'none';

    loadLedger();
  } catch (e) {
    console.error(e);
    alert('전자장부 저장 중 오류가 발생했습니다.');
  }
}

// (예전 CSV 업로드용 – 필요시 사용)
async function uploadCsv(event){
  event.preventDefault();

  if (!IS_ADMIN) {
    alert('관리자 전용 기능입니다.');
    return;
  }

  const pw = document.getElementById('csv_pw').value.trim();
  if (!pw) {
    alert('비밀번호를 입력해 주세요.');
    return;
  }
  if (pw !== ADMIN_PW) {
    alert('비밀번호가 올바르지 않습니다.');
    return;
  }
  const fileInput = document.getElementById('ledger_csv');
  if (!fileInput.files.length) {
    alert('CSV 파일을 선택해 주세요.');
    return;
  }

  const fd = new FormData();
  fd.append('action','upload_ledger_csv');
  fd.append('ledger_csv', fileInput.files[0]);

  try {
    const res = await fetch(API_URL, {
      method:'POST',
      body: fd
    });
    const json = await res.json();
    if (!json.ok) {
      alert('CSV 업로드 실패: ' + (json.msg || '서버 오류'));
      return;
    }
    alert('✅ CSV 업로드 및 반영이 완료되었습니다.');
    document.getElementById('csv_pw').value = '';
    document.getElementById('ledger_csv').value = '';
    loadLedger();
  } catch (e) {
    console.error(e);
    alert('CSV 업로드 중 오류가 발생했습니다.');
  }
}

async function deleteLedger(id){
  if (!IS_ADMIN) {
    alert('관리자 전용 기능입니다.');
    return;
  }
  if (!confirm('이 거래를 삭제하시겠습니까?')) return;
  try {
    const res = await fetch(API_URL, {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({action:'delete_ledger', id})
    });
    const json = await res.json();
    if (!json.ok) {
      alert('삭제 실패: ' + (json.msg || '서버 오류'));
      return;
    }
    alert('✅ 삭제되었습니다.');
    loadLedger();
  } catch (e) {
    console.error(e);
    alert('삭제 중 오류가 발생했습니다.');
  }
}
