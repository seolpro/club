<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>⛰ 산악회 신청 관리자 페이지</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      background-color: #f5f5f5;
    }
    .badge-wait {
      background-color: #ffc107;
      color: #563d00;
    }
    .table-responsive {
      max-height: 70vh;
      overflow-y: auto;
    }
    .sms-btn {
      white-space: nowrap;
    }
  </style>
</head>
<body>
<div class="container py-3">
  <h3 class="mb-3">⛰ 산악회 동아리 참가신청 관리페이지</h3>
  <p class="text-muted mb-4">
    접수 현황을 확인하고, 관리자 수동 등록 및 삭제를 할 수 있습니다.<br>
    모바일에서 접속하면 각 행의 <strong>📨 문자</strong> 버튼으로 바로 문자 발송이 가능합니다.
  </p>

  <!-- 요약 통계 -->
  <div class="row g-3 mb-4">
    <div class="col-4">
      <div class="card text-center shadow-sm">
        <div class="card-body">
          <div class="fw-bold text-muted">총 신청 건수</div>
          <div id="statCount" class="fs-4 fw-bold">-</div>
        </div>
      </div>
    </div>
    <div class="col-4">
      <div class="card text-center shadow-sm">
        <div class="card-body">
          <div class="fw-bold text-muted">총 인원</div>
          <div id="statTotal" class="fs-4 fw-bold">-</div>
        </div>
      </div>
    </div>
    <div class="col-4">
      <div class="card text-center shadow-sm">
        <div class="card-body">
          <div class="fw-bold text-muted">대기 인원</div>
          <div id="statWaiting" class="fs-4 fw-bold">-</div>
        </div>
      </div>
    </div>
  </div>

  <!-- 검색 & 새로고침 -->
  <div class="d-flex gap-2 mb-2">
    <input type="text" id="searchInput" class="form-control" placeholder="🔍 이름 / 연락처 / 코스로 검색" />
    <button class="btn btn-outline-secondary" id="refreshBtn">↻ 새로고침</button>
  </div>

  <!-- 목록 -->
  <div class="card mb-4 shadow-sm">
    <div class="card-header d-flex justify-content-between align-items-center">
      <span>📋 신청 목록</span>
      <span class="text-muted" style="font-size:0.85rem;">* 삭제 시 DB에서 논리삭제되고, 사용자 화면에서도 사라집니다.</span>
    </div>
    <div class="card-body p-0 table-responsive">
      <table class="table table-sm table-hover text-center mb-0 align-middle">
        <thead class="table-light">
          <tr>
            <th>번호</th>
            <th>접수시각</th>
            <th>성명</th>
            <th>연락처</th>
            <th>인원<br><small>(비회원)</small></th>
            <th>동반회원</th>
            <th>코스</th>
            <th>비고</th>
            <th>상태</th>
            <th>SMS</th>
            <th>삭제</th>
          </tr>
        </thead>
        <tbody id="adminList"></tbody>
      </table>
    </div>
  </div>

  <!-- 관리자 수동 등록 -->
  <div class="card shadow-sm mb-5">
    <div class="card-header">
      ✏ 관리자 수동 등록
    </div>
    <div class="card-body">
      <div class="row g-2">
        <div class="col-6">
          <label class="form-label">성명*</label>
          <input type="text" class="form-control" id="a_name">
        </div>
        <div class="col-6">
          <label class="form-label">연락처*(11자리)</label>
          <input type="tel" class="form-control" id="a_contact" placeholder="01012345678">
        </div>
        <div class="col-4">
          <label class="form-label">인원*</label>
          <input type="number" class="form-control" id="a_participants" min="1" max="10">
        </div>
        <div class="col-4">
          <label class="form-label">비회원</label>
          <input type="number" class="form-control" id="a_nonMembers" min="0" max="10" value="0">
        </div>
        <div class="col-4">
          <label class="form-label">코스</label>
          <input type="text" class="form-control" id="a_course" value="단일 코스(한탄강 주상절리길외)">
        </div>
        <div class="col-12">
          <label class="form-label">동반회원 (쉼표로 구분)</label>
          <input type="text" class="form-control" id="a_memberNames" placeholder="예: 홍길동,김신협">
        </div>
        <div class="col-12">
          <label class="form-label">비고(코멘트)</label>
          <input type="text" class="form-control" id="a_comment" placeholder="선택 사항">
        </div>
      </div>
      <button class="btn btn-outline-primary w-100 mt-3" id="adminAddBtn">📥 수동 등록</button>
    </div>
  </div>
</div>

<script>
  const API_URL = 'apply_api.php';
  const MAX_CAPACITY = 40;   // 통계 계산용 (프론트에서 다시 체크)

  let allData = [];

  // 데이터 불러오기
  function loadAdminEntries() {
    fetch(API_URL)
      .then(res => res.json())
      .then(data => {
        allData = Array.isArray(data) ? data : [];
        renderAdminTable(allData);
      })
      .catch(err => {
        console.error(err);
        alert('❌ 신청 목록을 불러오지 못했습니다.');
      });
  }

  // 테이블 렌더링
  function renderAdminTable(data) {
    const tbody = document.getElementById('adminList');
    tbody.innerHTML = '';

    let totalCount = 0;
    let totalPeople = 0;
    let waitingPeople = 0;

    // 정원 기준으로 다시 대기 계산 (백엔드 isWaiting도 있지만, 프론트에서 한 번 더)
    let accumulated = 0;
    const withWait = data.map(row => {
      const p = Number(row.participants) || 0;
      const wait = accumulated >= MAX_CAPACITY;
      accumulated += p;
      return { ...row, calcWaiting: wait };
    });

    withWait.forEach((row, idx) => {
      totalCount++;
      const p = Number(row.participants) || 0;
      totalPeople += p;
      if (row.calcWaiting || row.isWaiting) waitingPeople += p;

      const tr = document.createElement('tr');

      const maskedContact = (row.contact || '').replace(/(\d{3})(\d{3,4})(\d{4})/, '$1-$2-$3');

      tr.innerHTML = `
        <td>${idx + 1}</td>
        <td style="font-size:0.75rem;">${row.time || ''}</td>
        <td>${row.name}</td>
        <td>${maskedContact}</td>
        <td>${p}<br><small class="text-muted">(${row.nonMembers || 0})</small></td>
        <td style="font-size:0.75rem;">${row.memberNames || ''}</td>
        <td style="font-size:0.75rem;">${row.course || ''}</td>
        <td style="font-size:0.75rem;">${row.comment || ''}</td>
        <td>
          ${row.calcWaiting || row.isWaiting
            ? '<span class="badge badge-wait">대기</span>'
            : '<span class="badge bg-success">정상</span>'}
        </td>
        <td>
          <button class="btn btn-outline-primary btn-sm sms-btn" onclick="sendSMS('${row.contact || ''}', '${row.name || ''}')">📨 문자</button>
        </td>
        <td>
          <button class="btn btn-outline-danger btn-sm" onclick="adminDelete(${row.id}, '${row.name}')">⛔</button>
        </td>
      `;

      tbody.appendChild(tr);
    });

    document.getElementById('statCount').textContent   = totalCount;
    document.getElementById('statTotal').textContent   = totalPeople + '명';
    document.getElementById('statWaiting').textContent = waitingPeople + '명';
  }

  // 검색
  document.getElementById('searchInput').addEventListener('input', function () {
    const q = this.value.trim().toLowerCase();
    if (!q) {
      renderAdminTable(allData);
      return;
    }
    const filtered = allData.filter(row => {
      return (
        (row.name || '').toLowerCase().includes(q) ||
        (row.contact || '').toLowerCase().includes(q) ||
        (row.course || '').toLowerCase().includes(q)
      );
    });
    renderAdminTable(filtered);
  });

  // 새로고침
  document.getElementById('refreshBtn').addEventListener('click', function () {
    loadAdminEntries();
  });

  // 관리자 수동 등록
  document.getElementById('adminAddBtn').addEventListener('click', function () {
    const name        = document.getElementById('a_name').value.trim();
    const contact     = document.getElementById('a_contact').value.trim();
    const participants= parseInt(document.getElementById('a_participants').value, 10) || 0;
    const nonMembers  = parseInt(document.getElementById('a_nonMembers').value, 10) || 0;
    const course      = document.getElementById('a_course').value.trim();
    const memberNames = document.getElementById('a_memberNames').value.trim();
    const comment     = document.getElementById('a_comment').value.trim();

    if (!name || !contact || participants <= 0) {
      alert('필수 항목(성명, 연락처, 인원)을 입력해 주세요.');
      return;
    }
    if (!/^\d{11}$/.test(contact)) {
      alert('연락처는 숫자 11자리로 입력해 주세요.');
      return;
    }

    const payload = {
      action: 'register',
      name,
      contact,
      participants,
      nonMembers,
      memberNames,
      course,
      comment
    };

    if (!confirm(`다음 내용으로 수동 등록하시겠습니까?\n\n${name} / ${contact}\n인원: ${participants} (비회원: ${nonMembers})`)) {
      return;
    }

    const btn = this;
    const original = btn.innerHTML;
    btn.disabled = true;
    btn.innerHTML = '🔄 등록 중...';

    fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    })
    .then(res => res.json())
    .then(res => {
      if (!res.ok) throw new Error(res.msg || '등록 실패');
      alert('✅ 수동 등록이 완료되었습니다.');
      // 폼 초기화
      document.getElementById('a_name').value = '';
      document.getElementById('a_contact').value = '';
      document.getElementById('a_participants').value = '';
      document.getElementById('a_nonMembers').value = '0';
      document.getElementById('a_memberNames').value = '';
      document.getElementById('a_comment').value = '';
      loadAdminEntries();
    })
    .catch(err => {
      alert('❌ 등록 실패: ' + err.message);
    })
    .finally(() => {
      btn.disabled = false;
      btn.innerHTML = original;
    });
  });

  // 삭제
  function adminDelete(id, name) {
    if (!confirm(`정말로 [${name}] 신청을 삭제하시겠습니까?`)) return;

    const reason = prompt('삭제 사유를 입력해 주세요. (선택, 메일 알림용)', '관리자 삭제');
    const payload = {
      action: 'delete',
      id,
      reason: reason || ''
    };

    fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    })
    .then(res => res.json())
    .then(res => {
      if (!res.ok) throw new Error(res.msg || '삭제 실패');
      alert('✅ 삭제가 완료되었습니다.');
      loadAdminEntries();
    })
    .catch(err => {
      alert('❌ 삭제 실패: ' + err.message);
    });
  }

  // 모바일 문자 보내기
  function sendSMS(contact, name) {
    if (!contact) {
      alert('연락처 정보가 없습니다.');
      return;
    }

    const defaultMsg = `[산악회] ${name || ''}님, 속리산 산행 관련 안내드립니다.`;
    const msg = prompt('보낼 문자 내용을 입력해 주세요.', defaultMsg);
    if (!msg) return;

    const encoded = encodeURIComponent(msg);
    const ua = navigator.userAgent.toLowerCase();
    let smsLink = '';

    if (/iphone|ipad|ipod/.test(ua)) {
      smsLink = `sms:${contact}&body=${encoded}`;
    } else if (/android/.test(ua)) {
      smsLink = `sms:${contact}?body=${encoded}`;
    } else {
      alert('📱 문자 발송은 모바일 기기에서만 가능합니다.');
      return;
    }

    window.location.href = smsLink;
  }

  // 전역에서 쓰기 위해 window에 바인딩
  window.adminDelete = adminDelete;
  window.sendSMS = sendSMS;

  // 초기 로딩
  document.addEventListener('DOMContentLoaded', function () {
    loadAdminEntries();
  });
</script>
</body>
</html>
