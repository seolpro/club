<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>정기이사회 참석 자동 문자</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body {
      font-family: sans-serif;
      background: #f5f5f5;
      text-align: center;
      padding-top: 100px;
    }
  </style>
  <script>
    window.onload = () => {
      // 자동 실행: 문자 앱 열기
      const message = encodeURIComponent("정기이사회 참석예정입니다");
      const phone = "01063542163"; // 👈 수신자 전화번호
      const smsLink = `sms:${phone}?body=${message}`;

      // 문자앱으로 리디렉션
      window.location.href = smsLink;

      // 사용자 안내
      setTimeout(() => {
        document.getElementById("status").textContent =
          "📨 문자 메시지 앱이 열리지 않는 경우, 수동으로 전송해주세요.";
      }, 3000);
    };
  </script>
</head>
<body>
  <h2>📢 정기이사회 참석 문자가 자동으로 전송됩니다.</h2>
  <p id="status" style="margin-top: 20px; color: #555;"></p>
</body>
</html>
