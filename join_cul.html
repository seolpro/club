<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>✈ 문화탐방 동아리 가입 신청서</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
   <!-- ✅ 즉시 이동 (가장 간단/확실) -->
  <meta http-equiv="refresh" content="0; url=https://seolhopro.mycafe24.com/cul/join_cul.html" />

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background: #f8f9fa;
    }
    .form-container {
      max-width: 600px;
      background: #ffffff;
      border-radius: 20px;
      padding: 30px;
      margin: 40px auto;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
    .form-title {
      text-align: center;
      margin-bottom: 30px;
    }
    .form-title h3 {
      font-weight: 700;
    }
    .input-group-text {
      font-size: 1.2rem;
    }
    .submit-btn {
      width: 100%;
      padding: 10px;
      font-size: 1.2rem;
      font-weight: bold;
      border-radius: 10px;
    }
    #loading {
      text-align: center;
      margin-top: 10px;
      color: #0d6efd;
    }
  </style>
</head>
<body>
  <div class="form-container shadow">
    <div class="form-title">
      <h4>✈ 문화탐방 동아리 가입 신청서</h4>
      <p class="text-muted">✅정확히 입력해주세요. 운영진 확인 후 연락드립니다.</p>
    </div>
    <form id="cultureForm">
      <div class="mb-3 input-group">
        <span class="input-group-text">📌</span>
        <input type="number" name="employeeId" class="form-control" placeholder="사번" required>
      </div>
      <div class="mb-3 input-group">
        <span class="input-group-text">👤</span>
        <input type="text" name="name" class="form-control" placeholder="성명" required>
      </div>
      <div class="mb-3 input-group">
        <span class="input-group-text">🏢</span>
        <input type="text" name="job" class="form-control" placeholder="부서명" required>
      </div>
      <div class="mb-3 input-group">
        <span class="input-group-text">📞</span>
        <input type="tel" name="contact" class="form-control" placeholder="연락처 (숫자만)" required>
      </div>
      <div class="mb-3">
        <label class="form-label">🎯 가입 동기</label>
        <select class="form-select" name="motivation">
          <option value="">✔️선택하세요</option>
          <option value="문화(여가)생활">문화(여가)생활</option>
          <option value="여행">여행</option>
          <option value="친목도모">친목도모</option>
          <option value="역사기행">역사기행</option>
          <option value="기타">기타</option>
        </select>
      </div>
      <div class="mb-3">
        <label for="comment" class="form-label">💬 기타 코멘트 (선택)</label>
        <textarea class="form-control" name="comment" rows="2" placeholder="전하고 싶은 말을 적어주세요"></textarea>
      </div>
      <button type="submit" class="btn btn-primary submit-btn">📤 신청서 제출</button>
      <div id="loading" style="display:none;">⏳ 제출 중입니다...</div>
    </form>
  </div>

  <script>
    document.getElementById("cultureForm").addEventListener("submit", async function (e) {
  e.preventDefault();
  const form = e.target;
  const formData = new FormData(form);
  const params = new URLSearchParams(formData);

  const name = form.name.value.trim();
  const job = form.job.value.trim();
  const contact = form.contact.value.trim();
  const employeeId = form.employeeId.value.trim();
  const submitBtn = form.querySelector("button[type='submit']");

  if (!name || !job || !contact || !employeeId) {
    alert("사번, 성명, 부서명, 연락처는 필수입니다.");
    return;
  }

  const confirmMsg = `입력 확인:\n\n사번: ${employeeId}\n성명: ${name}\n부서명: ${job}\n연락처: ${contact}\n가입 동기: ${form.motivation.value}\n\n제출하시겠습니까?`;
  if (!confirm(confirmMsg)) return;

  // 버튼 텍스트 변경 및 비활성화
  submitBtn.disabled = true;
  submitBtn.innerHTML = "🔂 제출중...";

  document.getElementById("loading").style.display = "block";

  try {
    await fetch("https://script.google.com/macros/s/AKfycbw2mTyzISYoUUdWd_SBECyZCVOYDH8I9_CyLo4JFR1vbLsc2PDLNCpax-MB0Vk9TnpR/exec", {
      method: "POST",
      body: params,
      mode: "no-cors"
    });
    alert("✅ 신청이 완료되었습니다. 감사합니다!");
    form.reset();
  } catch (error) {
    alert("⚠️ 제출 중 오류가 발생했습니다.");
  } finally {
    document.getElementById("loading").style.display = "none";
    submitBtn.disabled = false;
    submitBtn.innerHTML = "📤 신청서 제출";
  }
});
  </script>
</body>
</html>
